<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myPOS SDK Demo - Interactive Checkout Functions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .config-status {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 30px;
            color: white;
            backdrop-filter: blur(10px);
        }

        .config-status h3 {
            margin-bottom: 10px;
        }

        .config-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            font-size: 0.9rem;
        }

        .config-item {
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 5px;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .tab {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .function-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .function-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .function-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .function-header {
            margin-bottom: 20px;
        }

        .function-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .function-description {
            color: #718096;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #4a5568;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group.required label::after {
            content: ' *';
            color: #e53e3e;
        }

        .advanced-options {
            margin-top: 15px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .advanced-toggle {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .advanced-content {
            display: none;
        }

        .advanced-content.show {
            display: block;
        }

        .execute-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.3s ease;
            width: 100%;
            margin-top: 15px;
        }

        .execute-btn:hover {
            transform: translateY(-2px);
        }

        .execute-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .response.success {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            color: #22543d;
        }

        .response.error {
            background: #fed7d7;
            border: 1px solid #feb2b2;
            color: #742a2a;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 500;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .copy-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #38a169;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .function-grid {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 myPOS SDK Demo</h1>
            <p>Interactive testing for all 28 checkout functions</p>
        </div>

        <div class="config-status">
            <h3>⚙️ Configuration Status</h3>
            <div class="config-info" id="configInfo">
                <div class="loading show">
                    <div class="spinner"></div>
                    Loading configuration...
                </div>
            </div>
        </div>

        <div class="tabs" id="tabs">
            <!-- Tabs will be populated by JavaScript -->
        </div>

        <div id="tabContent">
            <!-- Tab content will be populated by JavaScript -->
        </div>
    </div>

    <script>
        let functionCategories = {};
        let currentConfig = {};
        let responseData = {}; // Store response data for button functions

        // Load configuration
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                currentConfig = await response.json();
                displayConfig();
            } catch (error) {
                document.getElementById('configInfo').innerHTML = 
                    '<div class="config-item" style="color: #e53e3e;">Error loading configuration: ' + error.message + '</div>';
            }
        }

        function displayConfig() {
            const configInfo = document.getElementById('configInfo');
            configInfo.innerHTML = `
                <div class="config-item"><strong>Environment:</strong> ${currentConfig.environment || 'Not set'}</div>
                <div class="config-item"><strong>SID:</strong> ${currentConfig.sid || 'Not set'}</div>
                <div class="config-item"><strong>Client Number:</strong> ${currentConfig.clientNumber || 'Not set'}</div>
                <div class="config-item"><strong>Currency:</strong> ${currentConfig.currency || 'EUR'}</div>
                <div class="config-item"><strong>Success URL:</strong> ${currentConfig.successUrl || 'Not set'}</div>
                <div class="config-item"><strong>Cancel URL:</strong> ${currentConfig.cancelUrl || 'Not set'}</div>
            `;
        }

        // Load function categories
        async function loadFunctions() {
            try {
                const response = await fetch('/api/functions');
                functionCategories = await response.json();
                renderTabs();
                renderTabContent();
            } catch (error) {
                console.error('Error loading functions:', error);
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs');
            const tabKeys = Object.keys(functionCategories);
            
            tabKeys.forEach((key, index) => {
                const tab = document.createElement('button');
                tab.className = `tab ${index === 0 ? 'active' : ''}`;
                tab.textContent = functionCategories[key].title;
                tab.onclick = () => switchTab(key);
                tabsContainer.appendChild(tab);
            });
        }

        function renderTabContent() {
            const tabContent = document.getElementById('tabContent');
            const tabKeys = Object.keys(functionCategories);
            
            tabKeys.forEach((key, index) => {
                const content = document.createElement('div');
                content.className = `tab-content ${index === 0 ? 'active' : ''}`;
                content.id = `tab-${key}`;
                
                const functions = functionCategories[key].functions;
                const functionGrid = document.createElement('div');
                functionGrid.className = 'function-grid';
                
                functions.forEach(func => {
                    const card = createFunctionCard(func);
                    functionGrid.appendChild(card);
                });
                
                content.appendChild(functionGrid);
                tabContent.appendChild(content);
            });
        }

        function createFunctionCard(func) {
            const card = document.createElement('div');
            card.className = 'function-card';
            
            const formFields = getFormFieldsForFunction(func.name);
            
            card.innerHTML = `
                <div class="function-header">
                    <div class="function-title">${func.title}</div>
                    <div class="function-description">${func.description}</div>
                </div>
                
                <form id="form-${func.name}" onsubmit="executeFunction('${func.name}', event)">
                    ${formFields}
                    
                    <button type="submit" class="execute-btn">
                        Execute ${func.title}
                    </button>
                </form>
                
                <div class="loading" id="loading-${func.name}">
                    <div class="spinner"></div>
                    Executing...
                </div>
                
                <div class="response" id="response-${func.name}" style="display: none;"></div>
            `;
            
            // Auto-detect country for this specific form
            setTimeout(() => {
                detectUserCountry();
            }, 100);
            
            return card;
        }

        function toggleAdvanced(functionName) {
            const advanced = document.getElementById(`advanced-${functionName}`);
            advanced.classList.toggle('show');
        }

        function switchTab(tabKey) {
            // Remove active class from all tabs and content
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Add active class to selected tab and content
            event.target.classList.add('active');
            document.getElementById(`tab-${tabKey}`).classList.add('active');
        }

        async function executeFunction(functionName, event) {
            event.preventDefault();
            
            const form = event.target;
            const formData = new FormData(form);
            const params = {};
            
            // Convert FormData to object
            for (let [key, value] of formData.entries()) {
                if (key.includes('[') && key.includes(']')) {
                    // Handle nested objects like customer[email]
                    const [parent, child] = key.split('[');
                    const childKey = child.replace(']', '');
                    if (!params[parent]) params[parent] = {};
                    params[parent][childKey] = value;
                } else {
                    params[key] = value;
                }
            }
            
            // Convert string values to appropriate types
            if (params.amount) params.amount = parseFloat(params.amount);
            if (params.paymentParametersRequired) params.paymentParametersRequired = parseInt(params.paymentParametersRequired);
            if (params.cart) {
                try {
                    params.cart = JSON.parse(params.cart);
                } catch (e) {
                    showResponse(functionName, false, 'Invalid cart JSON format');
                    return;
                }
            }
            
            // Clean up customer data - remove empty values to avoid sending "undefined"
            if (params.customer) {
                Object.keys(params.customer).forEach(key => {
                    if (!params.customer[key] || params.customer[key] === '') {
                        delete params.customer[key];
                    }
                });
            }
            
            // Show loading
            document.getElementById(`loading-${functionName}`).classList.add('show');
            document.querySelector(`#form-${functionName} .execute-btn`).disabled = true;
            
            try {
                const response = await fetch(`/api/execute/${functionName}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(params)
                });
                
                const result = await response.json();
                showResponse(functionName, result.success, result.success ? result.data : result.error);
            } catch (error) {
                showResponse(functionName, false, error.message);
            } finally {
                document.getElementById(`loading-${functionName}`).classList.remove('show');
                document.querySelector(`#form-${functionName} .execute-btn`).disabled = false;
            }
        }

        function showResponse(functionName, success, data) {
            const responseDiv = document.getElementById(`response-${functionName}`);
            responseDiv.style.display = 'block';
            responseDiv.className = `response ${success ? 'success' : 'error'}`;
            
            // Store the response data for button functions
            responseData[functionName] = data;
            
            const jsonString = JSON.stringify(data, null, 2);
            
            // Check if this is a purchase response with redirect capabilities
            const hasPurchaseRedirect = success && data && data.redirectUrl && data.rawResponse;
            
            let actionButtons = '';
            if (hasPurchaseRedirect && functionName === 'purchase') {
                actionButtons = `
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 2px solid #48bb78;">
                        <h4 style="margin-bottom: 10px; color: #2d3748;">Payment Redirect Options:</h4>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="copy-btn" onclick="openInNewTab('${functionName}')">
                                🪟 Open in New Tab
                            </button>
                            <button class="copy-btn" onclick="proceedToPayment('${functionName}')">
                                💳 Proceed to Payment
                            </button>
                        </div>
                    </div>
                `;
            }
            
            responseDiv.innerHTML = `
                <pre>${jsonString}</pre>
                <button class="copy-btn" onclick="copyToClipboard('${functionName}')">Copy Response</button>
                ${actionButtons}
            `;
        }
        
        // Open payment form in new tab
        function openInNewTab(functionName) {
            const data = responseData[functionName];
            
            if (data && data.rawResponse) {
                const newWindow = window.open('', '_blank');
                newWindow.document.write(data.rawResponse);
                newWindow.document.close();
            } else {
                alert('No payment data available. Please execute a purchase function first.');
            }
        }
        
        // Proceed to Payment button (opens in same tab with confirmation)
        function proceedToPayment(functionName) {
            const data = responseData[functionName];
            
            if (data && data.rawResponse) {
                if (confirm('You will be redirected to the myPOS checkout page. Continue?')) {
                    // Create a temporary container and render the form
                    const container = document.createElement('div');
                    container.style.display = 'none';
                    container.innerHTML = data.rawResponse;
                    document.body.appendChild(container);
                    
                    // Find and submit the form
                    const form = container.querySelector('form');
                    if (form) {
                        document.body.appendChild(form);
                        form.submit();
                    }
                }
            } else {
                alert('No payment data available. Please execute a purchase function first.');
            }
        }

        function copyToClipboard(functionName) {
            const responseDiv = document.getElementById(`response-${functionName}`);
            const text = responseDiv.querySelector('pre').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Response copied to clipboard!');
            });
        }

        // Auto-detect user's country
        async function detectUserCountry() {
            try {
                // Try to get country from browser's timezone
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const countryCode = timezone.split('/')[0];
                
                // Map some common timezone countries to country codes
                const timezoneToCountry = {
                    'America': 'US',
                    'Europe': 'GB', // Default to GB for Europe
                    'Asia': 'CN',   // Default to CN for Asia
                    'Africa': 'ZA', // Default to ZA for Africa
                    'Australia': 'AU',
                    'Pacific': 'NZ'
                };
                
                let detectedCountry = timezoneToCountry[countryCode] || 'US';
                
                // Try to get more specific location using a geolocation API
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    const data = await response.json();
                    if (data.country_code) {
                        detectedCountry = data.country_code;
                    }
                } catch (e) {
                    console.log('Could not detect country from IP, using timezone fallback');
                }
                
                // Set the detected country in all country selectors
                document.querySelectorAll('select[name="customer[country]"]').forEach(select => {
                    const option = select.querySelector(`option[value="${detectedCountry}"]`);
                    if (option) {
                        option.selected = true;
                    }
                });
                
                console.log(`Detected country: ${detectedCountry}`);
            } catch (error) {
                console.log('Could not detect country, using default');
            }
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            loadFunctions();
            detectUserCountry();
        });
    </script>
</body>
</html>
